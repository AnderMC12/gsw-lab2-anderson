# /etc/apache2/sites-available/dulcehogar.local-ssl.conf
# Cambia 172.22.0.1 por TU IP_HOST (ip route show | grep default).
# Si usas Linux nativo/macOS: http://localhost:9090/api
<IfModule mod_ssl.c>
<VirtualHost *:4443>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    <Directory /var/www/dulcehogar.local>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/dulcehogar.local/dulcehogar.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/dulcehogar.local/dulcehogar.local-key.pem

    # Reverse proxy hacia Express
    ProxyPreserveHost On
    ProxyPass        /api http://172.22.0.1:9090/api
    ProxyPassReverse /api http://172.22.0.1:9090/api

    # Cabeceras de seguridad básicas (requiere a2enmod headers)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    # Necesarios para la evidencia de logs (Paso 4.9)
    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>
</IfModule>
