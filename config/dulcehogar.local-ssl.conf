<IfModule mod_ssl.c>
<VirtualHost *:4443>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    <Directory /var/www/dulcehogar.local>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/dulcehogar.local/dulcehogar.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/dulcehogar.local/dulcehogar.local-key.pem

    ProxyPreserveHost On
    ProxyPass        /api http://172.30.208.1:9090/api
    ProxyPassReverse /api http://172.30.208.1:9090/api

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>
</IfModule>
