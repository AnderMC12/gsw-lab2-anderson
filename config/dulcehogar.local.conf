# /etc/apache2/sites-available/dulcehogar.local.conf  (versión final - Fase 4)
# Todo lo que llega por HTTP (:8085) se redirige a HTTPS (:4443)
<VirtualHost *:8085>
    ServerName dulcehogar.local
    Redirect permanent / https://dulcehogar.local:4443/

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>
